<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Dashboard — RemConnect Admin Console</title>
  <link rel="icon" href="../assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css?v=4">
  <link rel="stylesheet" href="dashboard.css?v=4">
  <link rel="stylesheet" href="views.css?v=7">
  <link rel="stylesheet" href="modern.css?v=12">
  <link rel="stylesheet" href="screens.css?v=14">
  <link rel="stylesheet" href="screens-learning.css?v=13">
  <link rel="stylesheet" href="sidebar.css?v=17">
  <link rel="stylesheet" href="charts.css?v=17">
  <link rel="stylesheet" href="ui-extras.css?v=22">
  <link rel="stylesheet" href="layout.css?v=21">
  <link rel="stylesheet" href="roles.css?v=24">
  <link rel="stylesheet" href="search.css?v=25">
  <script>
    // Demo auth guard + saved theme (applied before paint).
    (function () {
      var s = null, t = null;
      try { s = sessionStorage.getItem('rc-admin-session') || localStorage.getItem('rc-admin-session'); t = localStorage.getItem('rc-admin-theme'); } catch (e) {}
      if (!s) location.replace('login.html');
      if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>
</head>
<body class="dash">
  <div class="frame">
    <header class="topbar">
      <a class="pill-box logo-pill" href="#overview" aria-label="RemConnect admin home">
        <span class="logo-dot"><span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span></span>
        <span class="brand-text">Rem<span>Connect</span></span>
      </a>
      <nav class="pill-box main-nav" id="mainNav" aria-label="Admin sections"></nav>
      <div class="pill-box icons-pill">
        <button class="round" id="searchBtn" aria-label="Search (Ctrl K)"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
        <button class="round" id="bell" aria-label="Notifications"><svg class="icon" viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="dot"></span></button>
        <button class="round" id="alertBtn" aria-label="System status"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg></button>
        <span class="pill-sep" aria-hidden="true"></span>
        <button class="round" id="helpBtn" aria-label="Help" title="Help"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17h.01"/></svg></button>
      </div>
      <div class="pill-box user-pill" id="userPill" tabindex="0" aria-haspopup="menu">
        <span class="avatar" id="userInitial">S</span>
        <div class="who"><b id="userName">Rem SuperAdmin</b><small id="userEmail">superadmin@remconnect.io</small></div>
        <svg class="icon" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="m6 9 6 6 6-6"/></svg>
        <div class="user-menu" id="userMenu" role="menu">
          <a href="#profile" role="menuitem">My profile</a>
          <a href="../index.html" role="menuitem">View website</a>
          <button id="themeToggle" role="menuitem">Switch light / dark</button>
          <button id="signOut" role="menuitem">Sign out</button>
        </div>
      </div>
    </header>

    <div class="body-wrap">
      <aside class="rail" id="rail" aria-label="Quick navigation"></aside>
      <main id="content"></main>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script src="demo-config.js"></script>
  <script src="screens.js?v=24"></script>
  <script src="admin.js?v=25"></script>
  <script src="search.js?v=27"></script>
  <script src="dropdown.js?v=19"></script>
</body>
</html>
